name: 认领
on:
  issues:
    types: [opened, edited, reopened, labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: claim
  cancel-in-progress: false
jobs:
  claim:
    if: contains(github.event.issue.labels.*.name, '认领')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check.py claim
